[package]
name = "klarity-exhibit-12-smart-app-launch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SMART app launch config checks"
publish = false

[lib]
name = "smart_launch"
path = "src/lib.rs"

[[bin]]
name = "validate-smart-launch"
path = "src/bin/validate_smart_launch.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
